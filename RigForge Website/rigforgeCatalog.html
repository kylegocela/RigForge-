<html>

<head>
    <meta charset="UTF-8">
    <title>Catalog | Rigforge Customs</title>
    <link rel="icon" type="image/x-icon" href="assets/rigforgeHeadLogo.png">
    <link rel="stylesheet" href="rigstyles.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght
    @0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,
    wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body class="force-no-scroll">
    <a href="rigforge.html" class="redirectHome">
        <div class="headerBar">
            <img src="assets/rigforge.png" alt="Rigforge Logo">
            <div class="textOverlap">
                <h2>RIGFORGE</h2>
                <span>Customs</span>
            </div>
    </a>
    <div class="navigator">
        <div class="navItems">
            <a href="rigforgeCatalog.html">Catalog</a>
            <a href="rigforgeBuildPage.html">Build</a>
            <a href="rigforgeAboutUs.html">About Us</a>
            <a id="userNavBtn" href="rigforgeLogin.html"><img src="assets/user.png" alt="user"></a>
        </div>
    </div>
    </div>

    <div class="catalogWrapper">

        <div class="redirection">
            <a href="rigforge.html">Home</a> &gt; Catalog
        </div>

        <div class="catalogMain">

            <aside class="catalogSidebar">

                <div class="filterGroup">
                    <h4>Category</h4>
                    <label class="filterOption">
                        <input type="checkbox" data-filter="category" value="Gaming"> Gaming
                    </label>
                    <label class="filterOption">
                        <input type="checkbox" data-filter="category" value="Office"> Office
                    </label>
                </div>

                <div class="filterGroup">
                    <h4>Brand</h4>
                    <label class="filterOption">
                        <input type="checkbox" data-filter="brand" value="AMD"> AMD
                    </label>
                    <label class="filterOption">
                        <input type="checkbox" data-filter="brand" value="NVIDIA"> NVIDIA
                    </label>
                    <label class="filterOption">
                        <input type="checkbox" data-filter="brand" value="INTEL"> INTEL
                    </label>
                </div>

                <div class="priceRangeGroup">
                    <h4>Prize Range</h4>
                    <div class="priceInputRow">
                        <span>&#8369;</span>
                        <input type="text" class="priceInput" placeholder="Min - Max xxx,xxx">
                    </div>
                </div>

                <div class="filterActions">
                    <button class="applyBtn">Apply Filters</button>
                    <button class="clearBtn">Clear All</button>
                </div>

            </aside>

            <div class="catalogContent">

                <div class="sortBar">
                    <label>Sort by:</label>
                    <select class="sortSelect" id="sortSelect">
                        <option value="best">Best Selling</option>
                        <option value="low">Price: Low to High</option>
                        <option value="high">Price: High to Low</option>
                        <option value="newest">Newest</option>
                    </select>
                </div>


                <div class="productGrid" id="productGrid"></div>

                <div class="numberBar">
                    <button class="pageBtn active">1</button>
                    <button class="pageBtn">2</button>
                    <button class="pageBtn">3</button>
                    <span class="pageDots">&#8230;</span>
                    <button class="pageBtn">9</button>
                    <button class="pageArrow">&#62;</button>
                </div>

            </div>

        </div>

    </div>

 
    <script src="rigforge.js"></script>

</body>

</html>
