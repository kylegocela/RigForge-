<html>

<head>
    <meta charset="UTF-8">
    <title>Quotation | Rigforge Customs</title>
    <link rel="icon" type="image/x-icon" href="assets/rigforgeHeadLogo.png">
    <link rel="stylesheet" href="rigstyles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <a href="rigforge.html" class="redirectHome">
        <div class="headerBar">
            <img src="assets/rigforge.png" alt="Rigforge Logo">
            <div class="textOverlap">
                <h2>RIGFORGE</h2>
                <span>Customs</span>
            </div>
    </a>
    <div class="navigator">
        <div class="navItems">
            <a href="rigforgeCatalog.html">Catalog</a>
            <a href="rigforgeBuildPage.html">Build</a>
            <a href="rigforgeAboutUs.html">About Us</a>
            <a id="userNavBtn" href="rigforgeLogin.html"><img src="assets/user.png" alt="user"></a>
        </div>
    </div>
    </div>

    <div class="quotationWrapper">

        <h2 class="quotationTitle">Custom Build Quotation Form</h2>

        <div class="quotationForm">

            <div class="quotationRow">
                <div class="quotationGroup">
                    <label class="quotationLabel">[ Full Name ]</label>
                    <input type="text" id="qFullName" class="quotationInput">
                    <span class="quotationError" id="errFullName"></span>
                </div>
                <div class="quotationGroup">
                    <label class="quotationLabel">[ Email ]</label>
                    <input type="text" id="qEmail" class="quotationInput">
                    <span class="quotationError" id="errEmail"></span>
                </div>
            </div>

            <div class="quotationRow alignTop">

                <div class="quotationGroup">
                    <label class="quotationLabel">Build Type</label>
                    <select id="qBuildType" class="quotationSelect">
                        <option>Gaming Rig</option>
                        <option>Workstation</option>
                        <option>Server</option>
                        <option>Office</option>
                        <option>Creative</option>
                    </select>
                </div>

                <div class="quotationGroup">
                    <label class="quotationLabel">Performance Target</label>

                    <label class="quotationSubLabel">Target Resolution</label>
                    <input type="text" class="quotationInput" placeholder="e.g. 1080p, 1440p, 4K">

                    <label class="quotationSubLabel">Target Framerate (FPS)</label>
                    <input type="text" class="quotationInput" placeholder="e.g.  300+">
                </div>

            </div>

            <div class="quotationGroup">
                <label class="quotationLabel">Hardware Preference (Optional)</label>
                <div class="quotationRow">
                    <div class="quotationGroup">
                        <label class="quotationSubLabel">Preferred CPU Brand</label>
                        <select class="quotationSelect">
                            <option>No Preference</option>
                            <option>Intel</option>
                            <option>AMD</option>
                        </select>
                    </div>
                    <div class="quotationGroup">
                        <label class="quotationSubLabel">Preferred GPU Brand</label>
                        <select class="quotationSelect">
                            <option>No Preference</option>
                            <option>Intel</option>
                            <option>AMD</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="quotationGroup">
                <label class="quotationLabel">Style & Features</label>
                <label class="quotationSubLabel">Case Color</label>
                <select class="quotationSelect quotationSelectNarrow">
                    <option>Black</option>
                    <option>White</option>
                    <option>Red</option>
                    <option>Custom</option>
                </select>
            </div>

            <div class="quotationRow">
                <div class="quotationGroup">
                    <label class="quotationLabel">Budget Range</label>
                    <input type="text" id="qBudget" class="quotationInput" placeholder="P10k - P15k, P15k - P20k, ...">
                    <span class="quotationError" id="errBudget"></span>
                </div>
                <div class="quotationGroup">
                    <label class="quotationLabel">Storage Needs</label>
                    <input type="text" class="quotationInput" placeholder="e.g 1TB SSD, 2TB SSD+HDD">
                </div>
            </div>

            <div class="quotationGroup">
                <label class="quotationLabel">Additional Requests</label>
                <textarea id="qAdditional" class="quotationTextarea" rows="5"></textarea>
            </div>

            <div class="quotationSubmitRow">
                <button class="quotationSubmitBtn" id="quotationSubmitBtn">Submit Request</button>
            </div>

        </div>

    </div>

    <div class="brandShowcase">
        <img src="assets/intel.png" alt="Intel">
        <img src="assets/amd.png" alt="AMD">
        <img src="assets/nvidia.webp" alt="NVIDIA">
        <img src="assets/msi.png" alt="MSI">
        <img src="assets/corsair.png" alt="Corsair">
        <img src="assets/asus.png" alt="ASUS">
        <img src="assets/kingston.png" alt="Kingston">
    </div>

    <script src="rigforge.js"></script>

</body>

</html>
